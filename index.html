<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nerkh</title>
<meta name="description" content="A minimal currency converter with live Tehran free-market toman rates, gold coins and crypto.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nerkh">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..500&family=Instrument+Serif&display=swap">
<style>
/* Layout: one quiet column of currencies; the active one takes the keypad, every other row follows */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --field: #E9EBF0;
  --fg: #151821;
  --muted: #6C7282;
  --faint: #9AA0AE;
  --line: #E1E4EA;
  --accent: #0E8A5F;
  --accent-soft: rgba(14, 138, 95, .09);
  --on-accent: #FFFFFF;
  --warn: #C46A0A;
  --danger: #D9443B;
  --on-danger: #FFFFFF;
  --scrim: rgba(20, 24, 33, .28);
  --serif: "Instrument Serif", "New York", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  --fa: -apple-system, "SF Arabic", "Geeza Pro", Tahoma, sans-serif;
  --pad-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C11; --surface: #14171F; --field: #1E222C; --fg: #ECEEF2; --muted: #868C9B; --faint: #5E6474;
    --line: #1C2029; --accent: #3DD598; --accent-soft: rgba(61, 213, 152, .08); --on-accent: #06140E;
    --warn: #F0A63A; --danger: #E5564C; --on-danger: #FFFFFF; --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C11; --surface: #14171F; --field: #1E222C; --fg: #ECEEF2; --muted: #868C9B; --faint: #5E6474;
  --line: #1C2029; --accent: #3DD598; --accent-soft: rgba(61, 213, 152, .08); --on-accent: #06140E;
  --warn: #F0A63A; --danger: #E5564C; --on-danger: #FFFFFF; --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 4px);
  padding-bottom: calc(var(--pad-h) + env(safe-area-inset-bottom, 0px) + 28px);
}

.bar { display: flex; justify-content: flex-end; align-items: center; gap: 4px; height: 44px; }
.text-btn { font-size: 16px; color: var(--accent); padding: 8px 8px; font-weight: 450; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); }
.icon-btn svg { width: 22px; height: 22px; }

.title { font: 400 44px/1 var(--serif); letter-spacing: -.01em; margin: 2px 0 6px; }
.status {
  display: flex; align-items: center; gap: 10px; min-height: 32px; color: var(--muted);
  font-size: 13px; letter-spacing: .02em; font-variant-numeric: tabular-nums; text-align: left;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.status.live .dot { animation: pulse 2.4s ease-in-out infinite; }
.status.stale .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--warn); }
.status.stale #statusText { color: var(--warn); }
.status .spin { width: 14px; height: 14px; color: var(--faint); margin-left: -2px; }
.status.busy .spin { animation: rot .9s linear infinite; color: var(--accent); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes rot { to { transform: rotate(360deg); } }

.list { list-style: none; margin: 14px 0 0; padding: 0; }
.row {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 14px 0 13px; border-top: 1px solid var(--line); cursor: pointer;
}
.row:last-child { border-bottom: 1px solid var(--line); }
.row::before {
  content: ""; position: absolute; inset: -1px -12px; border-radius: 14px; background: var(--accent-soft);
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.row.active::before { opacity: 1; }
.row.dragging { opacity: .55; }
.badge {
  position: relative; width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; background: var(--field); overflow: hidden;
  font: 500 15px/1 var(--sans); color: var(--muted); letter-spacing: -.02em;
}
.badge.emoji { font-size: 24px; background: transparent; }
.badge.gold { background: #EED9A4; color: #6B4E0E; }
.badge.crypto { background: var(--field); color: var(--fg); }
.who { position: relative; flex: 1; min-width: 0; }
.name { font: 400 23px/1.1 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { margin-top: 4px; font-size: 12.5px; color: var(--muted); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .fa { font-family: var(--fa); letter-spacing: 0; }
.val { position: relative; text-align: right; flex-shrink: 0; max-width: 62%; }
.num {
  font-weight: 200; font-size: 34px; line-height: 1; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.num.m { font-size: 28px; }
.num.s { font-size: 23px; }
.row.active .num { color: var(--accent); font-weight: 300; }
.caret { display: none; width: 2px; height: .9em; margin-left: 2px; background: var(--accent); vertical-align: -.08em; border-radius: 1px; animation: blink 1.1s steps(1) infinite; }
.row.active .caret { display: inline-block; }
@keyframes blink { 50% { opacity: 0; } }
.unit { margin-top: 5px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

.remove, .handle { display: none; }
.remove { position: relative; width: 24px; height: 24px; border-radius: 50%; background: var(--danger); color: var(--on-danger); place-items: center; flex-shrink: 0; }
.remove svg { width: 12px; height: 12px; }
.handle { position: relative; width: 36px; height: 40px; place-items: center; color: var(--muted); touch-action: none; cursor: grab; flex-shrink: 0; }
.handle svg { width: 18px; height: 18px; }
.editing .remove, .editing .handle { display: grid; }
.editing .row { cursor: default; }
.editing .row::before { opacity: 0; }
.editing .val { display: none; }

.hint { margin: 18px 0 0; font-size: 12.5px; color: var(--muted); max-width: 46ch; }
.hint a { color: inherit; }

/* Keypad */
.pad {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px);
  border-top: 1px solid var(--line);
  padding: 8px max(14px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(14px, env(safe-area-inset-right, 0px));
  transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.pad.closed { transform: translateY(100%); }
.keys { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.key {
  height: 52px; border-radius: 14px; display: grid; place-items: center;
  font: 300 25px/1 var(--sans); font-variant-numeric: tabular-nums; transition: background .12s;
}
.key:active, .key.down { background: var(--field); }
.key.fn { color: var(--muted); font-size: 17px; font-weight: 400; }
.key.fn svg { width: 24px; height: 24px; }
.key.zero { grid-column: span 2; }
.reopen {
  position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 9;
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
}
.reopen svg { width: 24px; height: 24px; }

/* Add sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; height: min(88%, 760px); background: var(--surface); color: var(--fg);
  border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rise .3s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-head {
  display: flex; gap: 8px; align-items: center; padding-block: 14px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.sheet-title { font: 400 24px/1 var(--serif); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: 18px; margin: 0; }
.search {
  flex: 1; min-width: 0; font: 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 0;
  background: var(--field); color: var(--fg); -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text;
}
.search::placeholder { color: var(--muted); }
.results { margin: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.group { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 18px 0 6px; }
.result { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
.result:disabled { opacity: .4; cursor: default; }
.result .badge { width: 32px; height: 32px; font-size: 13px; }
.result .badge.emoji { font-size: 21px; }
.r-who { flex: 1; min-width: 0; }
.r-name { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-sub { font-size: 12.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-sub .fa { font-family: var(--fa); }
.r-price { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { color: var(--muted); padding: 24px 0; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="bar">
    <button class="text-btn" id="editBtn" type="button">Edit</button>
    <button class="icon-btn" id="addBtn" type="button" aria-label="Add a currency">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <h1 class="title">Nerkh</h1>
  <button class="status" id="status" type="button" aria-live="polite" aria-label="Refresh rates">
    <span class="dot"></span><span id="statusText">Loading rates…</span>
    <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg>
  </button>

  <ul class="list" id="list"></ul>

  <p class="hint" id="hint">Tap any amount to type in that currency. Toman, gold and coins use the Tehran free market
    (<a href="https://www.tgju.org" target="_blank" rel="noopener">tgju.org</a>); other pairs use global rates.</p>
</main>

<div class="pad" id="pad">
  <div class="keys" id="keys">
    <button class="key" type="button" data-k="1">1</button>
    <button class="key" type="button" data-k="2">2</button>
    <button class="key" type="button" data-k="3">3</button>
    <button class="key fn" type="button" data-k="back" aria-label="Delete (hold to clear)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m11.5 9.5 5 5m0-5-5 5"/></svg>
    </button>
    <button class="key" type="button" data-k="4">4</button>
    <button class="key" type="button" data-k="5">5</button>
    <button class="key" type="button" data-k="6">6</button>
    <button class="key fn" type="button" data-k="clear">C</button>
    <button class="key" type="button" data-k="7">7</button>
    <button class="key" type="button" data-k="8">8</button>
    <button class="key" type="button" data-k="9">9</button>
    <button class="key fn" type="button" data-k="000">000</button>
    <button class="key zero" type="button" data-k="0">0</button>
    <button class="key" type="button" data-k=".">.</button>
    <button class="key fn" type="button" data-k="hide" aria-label="Hide keypad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
</div>
<button class="reopen" id="reopen" type="button" aria-label="Show keypad" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4" height="4" rx="1"/><rect x="10" y="4" width="4" height="4" rx="1"/><rect x="16" y="4" width="4" height="4" rx="1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="16" y="10" width="4" height="4" rx="1"/><rect x="10" y="16" width="4" height="4" rx="1"/></svg>
</button>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 class="sheet-title" id="sheetTitle">Add a currency</h2>
    <div class="sheet-head">
      <input class="search" id="q" type="search" placeholder="Name, code or نام فارسی" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button class="text-btn" id="cancelAdd" type="button">Done</button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const KEY = 'nerkh.v1', RATES_KEY = 'nerkh.rates.v1';
  const MIN = 60000;

  // ---- catalog ----
  // code|name|Persian name|glyph|kind|global code|tgju rial key|tgju USD key|fraction digits
  // Glyphs that are flags render as emoji; anything else is drawn in a small tinted circle.
  const fiat = (code, name, fa, flag, fraction = 2) =>
    ({ code, name, fa, glyph: flag, emoji: true, kind: 'fiat', global: code.toLowerCase(), tRial: 'price_' + code.toLowerCase(), tUSD: null, fraction });
  const crypto = (code, name, fa, glyph, tg, global) =>
    ({ code, name, fa, glyph, emoji: false, kind: 'crypto', global, tRial: `crypto-${tg}-irr`, tUSD: `crypto-${tg}`, fraction: 6 });
  const gold = (code, name, fa, glyph, tg, emoji = false) =>
    ({ code, name, fa, glyph, emoji, kind: 'gold', global: null, tRial: tg, tUSD: null, fraction: 3 });

  const CATALOG = [
    { code: 'IRT', name: 'Iranian Toman', fa: 'تومان', glyph: '🇮🇷', emoji: true, kind: 'fiat', global: null, tRial: null, tUSD: null, fraction: 0 },
    { code: 'IRR', name: 'Iranian Rial', fa: 'ریال', glyph: '🇮🇷', emoji: true, kind: 'fiat', global: null, tRial: null, tUSD: null, fraction: 0 },
    { code: 'USD', name: 'US Dollar', fa: 'دلار آمریکا', glyph: '🇺🇸', emoji: true, kind: 'fiat', global: 'usd', tRial: 'price_dollar_rl', tUSD: null, fraction: 2 },
    fiat('EUR', 'Euro', 'یورو', '🇪🇺'),
    fiat('GBP', 'British Pound', 'پوند انگلیس', '🇬🇧'),
    fiat('AED', 'UAE Dirham', 'درهم امارات', '🇦🇪'),
    fiat('TRY', 'Turkish Lira', 'لیر ترکیه', '🇹🇷'),
    fiat('CAD', 'Canadian Dollar', 'دلار کانادا', '🇨🇦'),
    fiat('AUD', 'Australian Dollar', 'دلار استرالیا', '🇦🇺'),
    fiat('CHF', 'Swiss Franc', 'فرانک سوئیس', '🇨🇭'),
    fiat('CNY', 'Chinese Yuan', 'یوان چین', '🇨🇳'),
    fiat('JPY', 'Japanese Yen', 'ین ژاپن', '🇯🇵', 0),
    fiat('SEK', 'Swedish Krona', 'کرون سوئد', '🇸🇪'),
    fiat('NOK', 'Norwegian Krone', 'کرون نروژ', '🇳🇴'),
    fiat('DKK', 'Danish Krone', 'کرون دانمارک', '🇩🇰'),
    fiat('RUB', 'Russian Ruble', 'روبل روسیه', '🇷🇺'),
    fiat('INR', 'Indian Rupee', 'روپیه هند', '🇮🇳'),
    fiat('IQD', 'Iraqi Dinar', 'دینار عراق', '🇮🇶', 0),
    fiat('SAR', 'Saudi Riyal', 'ریال عربستان', '🇸🇦'),
    fiat('QAR', 'Qatari Riyal', 'ریال قطر', '🇶🇦'),
    fiat('KWD', 'Kuwaiti Dinar', 'دینار کویت', '🇰🇼', 3),
    fiat('OMR', 'Omani Rial', 'ریال عمان', '🇴🇲', 3),
    fiat('BHD', 'Bahraini Dinar', 'دینار بحرین', '🇧🇭', 3),
    fiat('AFN', 'Afghan Afghani', 'افغانی', '🇦🇫'),
    fiat('AMD', 'Armenian Dram', 'درام ارمنستان', '🇦🇲', 0),
    fiat('AZN', 'Azerbaijani Manat', 'منات آذربایجان', '🇦🇿'),
    fiat('GEL', 'Georgian Lari', 'لاری گرجستان', '🇬🇪'),
    fiat('MYR', 'Malaysian Ringgit', 'رینگیت مالزی', '🇲🇾'),
    fiat('THB', 'Thai Baht', 'بات تایلند', '🇹🇭'),
    fiat('SGD', 'Singapore Dollar', 'دلار سنگاپور', '🇸🇬'),
    fiat('HKD', 'Hong Kong Dollar', 'دلار هنگ‌کنگ', '🇭🇰'),
    fiat('KRW', 'South Korean Won', 'وون کره', '🇰🇷', 0),
    fiat('NZD', 'New Zealand Dollar', 'دلار نیوزیلند', '🇳🇿'),

    crypto('USDT', 'Tether', 'تتر', '₮', 'tether', 'usdt'),
    crypto('BTC', 'Bitcoin', 'بیت‌کوین', '₿', 'bitcoin', 'btc'),
    crypto('ETH', 'Ethereum', 'اتریوم', 'Ξ', 'ethereum', 'eth'),
    crypto('SOL', 'Solana', 'سولانا', '◎', 'solana', 'sol'),
    crypto('TON', 'Toncoin', 'تون‌کوین', '◇', 'toncoin', 'ton'),
    crypto('XRP', 'XRP', 'ریپل', '✕', 'ripple', 'xrp'),
    crypto('TRX', 'Tron', 'ترون', 'T', 'tron', 'trx'),
    crypto('DOGE', 'Dogecoin', 'دوج‌کوین', 'Ð', 'dogecoin', 'doge'),

    gold('SEKEH', 'Emami Coin', 'سکه امامی', '🪙', 'sekee', true),
    gold('NIM', 'Half Coin', 'نیم سکه', '½', 'nim'),
    gold('ROB', 'Quarter Coin', 'ربع سکه', '¼', 'rob'),
    gold('GERAMI', 'Gram Coin', 'سکه گرمی', 'g', 'gerami'),
    gold('GOLD18', 'Gold 18k, gram', 'طلای ۱۸ عیار', '18', 'geram18'),
    gold('GOLD24', 'Gold 24k, gram', 'طلای ۲۴ عیار', '24', 'geram24'),
    gold('MESGHAL', 'Gold, mesghal', 'مثقال طلا', 'M', 'mesghal'),
    { code: 'XAU', name: 'Gold, ounce', fa: 'اونس طلا', glyph: 'Au', emoji: false, kind: 'gold', global: 'xau', tRial: null, tUSD: 'ons', fraction: 4 },
  ];
  const BY_CODE = Object.fromEntries(CATALOG.map(a => [a.code, a]));
  const KIND_TITLE = { fiat: 'Currencies', crypto: 'Crypto', gold: 'Gold & coins' };
  const DEFAULTS = ['USD', 'IRT', 'EUR', 'AED', 'TRY', 'USDT', 'SEKEH'];

  // ---- sources ----
  // tgju: Tehran free market in rials. Its call2-4 mirrors allow cross-origin reads.
  const TGJU = ['https://call2.tgju.org/ajax.json', 'https://call3.tgju.org/ajax.json', 'https://call4.tgju.org/ajax.json'];
  const ER = 'https://open.er-api.com/v6/latest/USD';
  const CAPI = ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
    'https://latest.currency-api.pages.dev/v1/currencies/usd.json'];

  async function getJSON(url, ms = 12000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    try {
      const res = await fetch(url, { cache: 'no-store', signal: ctl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }
  async function firstOf(urls, parse) {
    let err;
    for (const u of urls) { try { return parse(await getJSON(u)); } catch (e) { err = e; } }
    throw err;
  }
  const num = v => typeof v === 'number' ? v : typeof v === 'string' ? parseFloat(v.replace(/,/g, '')) : NaN;
  // tgju timestamps are Tehran wall time (UTC+3:30, no DST since 2022).
  const tehranTime = ts => { const t = Date.parse(ts.replace(' ', 'T') + '+03:30'); return isNaN(t) ? null : t; };

  const fetchTGJU = () => firstOf(TGJU, j => {
    const cur = j && j.current;
    if (!cur || !cur.price_dollar_rl) throw new Error('tgju: bad payload');
    const values = {};
    for (const [k, v] of Object.entries(cur)) { const p = num(v && v.p); if (p > 0) values[k] = p; }
    return { values, updated: tehranTime(cur.price_dollar_rl.ts || '') };
  });
  const lowerTable = obj => { const out = {}; for (const [k, v] of Object.entries(obj || {})) { const n = num(v); if (n > 0) out[k.toLowerCase()] = n; } return out; };
  const fetchER = () => getJSON(ER).then(j => {
    if (!j || !j.rates) throw new Error('er-api: bad payload');
    return { values: lowerTable(j.rates), updated: j.time_last_update_unix ? j.time_last_update_unix * 1000 : null };
  });
  const fetchCAPI = () => firstOf(CAPI, j => {
    if (!j || !j.usd) throw new Error('currency-api: bad payload');
    return { values: lowerTable(j.usd), updated: j.date ? Date.parse(j.date + 'T00:00:00Z') : null };
  });

  // Turn raw tables into "USD per unit" and "toman per unit" for every asset we know.
  function build(tg, global) {
    const usd = { USD: 1 }, toman = { IRT: 1, IRR: 0.1 };
    for (const a of CATALOG) {
      if (a.code === 'USD') continue;
      if (a.tUSD && tg[a.tUSD] > 0) usd[a.code] = tg[a.tUSD];
      else if (a.global && global[a.global] > 0) usd[a.code] = 1 / global[a.global];
    }
    const perUSD = tg.price_dollar_rl ? tg.price_dollar_rl / 10 : null;
    for (const a of CATALOG) {
      if (!a.tRial || !(tg[a.tRial] > 0)) continue;
      let v = tg[a.tRial] / 10;
      // Some tgju quotes are per 10 or 100 units; line them up with the dollar cross, or fall back to it.
      if (a.code !== 'USD' && perUSD && usd[a.code]) {
        const cross = perUSD * usd[a.code];
        const fit = [1, 10, 100, 1000].map(s => v / s).find(x => x / cross > 0.6 && x / cross < 1.67);
        v = fit ?? cross;
      }
      toman[a.code] = v;
    }
    if (toman.USD) for (const a of CATALOG) if (toman[a.code] == null && usd[a.code]) toman[a.code] = toman.USD * usd[a.code];
    return { usd, toman };
  }

  // Units of `to` for one unit of `from`. Pairs that both trade globally use global rates;
  // anything touching toman, rial or Iranian gold goes through Tehran prices.
  function rate(from, to) {
    if (!rates) return null;
    if (from === to) return 1;
    const u = rates.usd, t = rates.toman;
    if (u[from] && u[to]) return u[from] / u[to];
    if (t[from] && t[to]) return t[from] / t[to];
    return null;
  }

  // ---- state ----
  const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const persist = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } };
  let state = load(KEY);
  if (!state || !Array.isArray(state.selected)) state = { selected: DEFAULTS.slice(), active: 'USD', amount: '1', pad: true };
  state.selected = state.selected.filter(c => BY_CODE[c]);
  if (!state.selected.length) state.selected = DEFAULTS.slice();
  if (!state.selected.includes(state.active)) state.active = state.selected[0];
  if (typeof state.amount !== 'string' || !/^\d+(\.\d*)?$/.test(state.amount)) state.amount = '1';
  if (typeof state.pad !== 'boolean') state.pad = true;
  const save = () => persist(KEY, state);

  let rates = load(RATES_KEY);          // { usd, toman, iranUpdated, globalUpdated, fetchedAt, iranLive }
  if (!rates || !rates.usd || !rates.toman) rates = null;
  let busy = false, failed = false, editing = false;
  let fresh = false;                    // next key press starts a new number

  // ---- formatting ----
  const nf = new Map();
  const NF = (opts) => { const k = JSON.stringify(opts); let f = nf.get(k); if (!f) { f = new Intl.NumberFormat('en-US', opts); nf.set(k, f); } return f; };
  function fmtOpts(v, a) {
    const m = Math.abs(v);
    if (m === 0) return { maximumFractionDigits: 0 };
    if (m < 1 && !(a.kind === 'fiat' && a.fraction >= 2 && m >= 0.01)) return { maximumSignificantDigits: 4 };
    if (m >= 10000) return { maximumFractionDigits: 0 };
    const d = a.kind === 'crypto' ? (m >= 100 ? 2 : 4) : a.fraction;
    return { maximumFractionDigits: d, minimumFractionDigits: a.kind === 'fiat' ? d : 0 };
  }
  const fmt = (v, a) => NF(fmtOpts(v, a)).format(v);
  const plain = (v, a) => { const o = fmtOpts(v, a); delete o.minimumFractionDigits; return NF({ ...o, useGrouping: false }).format(v); };
  function typed(s) {
    const [i, f] = s.split('.');
    const head = NF({ maximumFractionDigits: 0 }).format(Number(i || 0));
    return f === undefined ? head : head + '.' + f;
  }
  const sizeClass = s => s.length > 14 ? 's' : s.length > 10 ? 'm' : '';
  function ago(t) {
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 48) return h + (h === 1 ? ' hour ago' : ' hours ago');
    return Math.round(h / 24) + ' days ago';
  }
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  // ---- dom ----
  const $ = id => document.getElementById(id);
  const list = $('list'), statusEl = $('status'), statusText = $('statusText'), hint = $('hint');
  const editBtn = $('editBtn'), addBtn = $('addBtn'), pad = $('pad'), reopen = $('reopen');
  const sheet = $('sheet'), q = $('q'), results = $('results'), cancelAdd = $('cancelAdd');
  const ICON_MINUS = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 6h7"/></svg>';
  const ICON_GRIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h16"/></svg>';
  const badge = a => `<span class="badge${a.emoji ? ' emoji' : ' ' + a.kind}" aria-hidden="true">${esc(a.glyph)}</span>`;
  let rows = [];

  function buildList() {
    list.textContent = '';
    rows = state.selected.map(code => {
      const a = BY_CODE[code];
      const li = document.createElement('li');
      li.className = 'row';
      li.innerHTML = `
        <button class="remove" type="button" aria-label="Remove ${esc(a.name)}">${ICON_MINUS}</button>
        ${badge(a)}
        <div class="who"><div class="name">${esc(a.name)}</div><div class="meta">${a.code} · <span class="fa" dir="rtl">${esc(a.fa)}</span></div></div>
        <div class="val"><div class="num"><span class="n"></span><span class="caret"></span></div><div class="unit"></div></div>
        <span class="handle" aria-hidden="true">${ICON_GRIP}</span>`;
      const r = { a, el: li, n: li.querySelector('.n'), num: li.querySelector('.num'), unit: li.querySelector('.unit') };
      li._row = r;
      li.addEventListener('click', e => {
        if (editing || e.target.closest('.remove, .handle')) return;
        activate(a.code);
      });
      li.querySelector('.remove').addEventListener('click', () => {
        if (state.selected.length <= 1) return;
        state.selected = state.selected.filter(c => c !== a.code);
        if (state.active === a.code) { state.active = state.selected[0]; state.amount = '1'; fresh = true; }
        save(); buildList();
      });
      const handle = li.querySelector('.handle');
      handle.addEventListener('pointerdown', e => startReorder(e, handle, li));
      list.appendChild(li);
      return r;
    });
    render();
  }

  function startReorder(e, handle, li) {
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    li.classList.add('dragging');
    const move = ev => {
      const others = [...list.children].filter(x => x !== li);
      const before = others.find(s => { const b = s.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (before) { if (li.nextElementSibling !== before) list.insertBefore(li, before); }
      else if (list.lastElementChild !== li) list.appendChild(li);
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      li.classList.remove('dragging');
      rows = [...list.children].map(x => x._row);
      state.selected = rows.map(r => r.a.code);
      save();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  }

  function value(code) {
    if (code === state.active) return Number(state.amount) || 0;
    const r = rate(state.active, code);
    return r == null ? null : r * (Number(state.amount) || 0);
  }

  // "1 EUR = 295,770 IRT", always in the direction that gives a number of at least 1.
  function unitLine(code) {
    const act = BY_CODE[state.active], a = BY_CODE[code];
    const r = rate(code, state.active);
    if (r == null) return '';
    return r >= 1 ? `1 ${a.code} = ${fmt(r, act)} ${act.code}` : `1 ${act.code} = ${fmt(1 / r, a)} ${a.code}`;
  }

  function render() {
    for (const r of rows) {
      const active = r.a.code === state.active;
      r.el.classList.toggle('active', active);
      let s;
      if (active) s = typed(state.amount);
      else { const v = value(r.a.code); s = v == null ? '—' : fmt(v, r.a); }
      r.n.textContent = s;
      r.num.className = 'num ' + sizeClass(s);
      r.unit.textContent = active ? (rates ? r.a.code : '') : unitLine(r.a.code);
    }
    renderStatus();
    document.body.classList.toggle('editing', editing);
    list.classList.toggle('editing', editing);
    editBtn.textContent = editing ? 'Done' : 'Edit';
    hint.hidden = editing;
    const showPad = state.pad && !editing;
    pad.classList.toggle('closed', !showPad);
    reopen.hidden = showPad || editing;
    document.documentElement.style.setProperty('--pad-h', showPad ? pad.offsetHeight + 'px' : '0px');
    const dot = pad.querySelector('[data-k="."]');
    dot.disabled = !fresh && state.amount.includes('.');
  }

  function renderStatus() {
    statusEl.classList.toggle('busy', busy);
    if (!rates) {
      statusEl.className = 'status' + (busy ? ' busy' : ' stale');
      statusText.textContent = busy ? 'Loading rates…' : 'Offline. Tap to retry';
      return;
    }
    const iranAt = rates.iranUpdated || rates.fetchedAt;
    const old = Date.now() - rates.fetchedAt > 30 * MIN;
    const stale = failed || old || !rates.iranLive;
    statusEl.className = 'status' + (busy ? ' busy' : '') + (stale ? ' stale' : ' live');
    if (busy && stale) { statusText.textContent = 'Updating…'; return; }
    if (failed || old) statusText.textContent = `Offline · rates from ${ago(rates.fetchedAt)}`;
    else if (!rates.iranLive) statusText.textContent = `Tehran market unavailable · ${ago(iranAt)}`;
    else statusText.textContent = `Tehran market · updated ${ago(iranAt)}`;
  }

  // ---- input ----
  function activate(code) {
    if (code !== state.active) {
      const v = value(code);
      state.active = code;
      state.amount = v == null ? '1' : plain(v, BY_CODE[code]);
      fresh = true;
      save();
    }
    if (!state.pad) { state.pad = true; save(); }
    render();
  }

  function press(k) {
    if (k === 'hide') { state.pad = false; save(); render(); return; }
    let s = state.amount;
    if (fresh) { fresh = false; if (k !== 'back') s = '0'; }
    const [i, f] = s.split('.');
    if (/^\d$/.test(k)) {
      if (f !== undefined) { if (f.length >= 8) return; } else if (i.length >= 15) return;
      s = s === '0' ? k : s + k;
    } else if (k === '000') {
      if (s === '0' || f !== undefined || i.length > 12) return;
      s += '000';
    } else if (k === '.') {
      if (f !== undefined) return;
      s += '.';
    } else if (k === 'back') {
      s = s.slice(0, -1) || '0';
    } else if (k === 'clear') {
      s = '0';
    }
    state.amount = s;
    save();
    render();
  }

  // Keys fire on pointerdown for speed; holding delete clears.
  let holdTimer = 0, held = false;
  pad.addEventListener('pointerdown', e => {
    const b = e.target.closest('.key');
    if (!b || b.disabled) return;
    e.preventDefault();
    b.classList.add('down');
    const k = b.dataset.k;
    held = false;
    if (k === 'back') holdTimer = setTimeout(() => { held = true; press('clear'); }, 450);
    else press(k);
    const up = () => {
      b.classList.remove('down');
      clearTimeout(holdTimer);
      if (k === 'back' && !held) press('back');
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  reopen.addEventListener('click', () => { state.pad = true; save(); render(); });

  document.addEventListener('keydown', e => {
    if (!sheet.hidden || e.metaKey || e.ctrlKey) return;
    const map = { Backspace: 'back', Escape: 'clear', Delete: 'clear', '.': '.', ',': '.' };
    const k = /^\d$/.test(e.key) ? e.key : map[e.key];
    if (k) { e.preventDefault(); press(k); }
  });

  // ---- refresh ----
  async function refresh() {
    if (busy) return;
    busy = true; renderStatus();
    const [tg, er, capi] = await Promise.allSettled([fetchTGJU(), fetchER(), fetchCAPI()]);
    const T = tg.status === 'fulfilled' ? tg.value : null;
    const E = er.status === 'fulfilled' ? er.value : null;
    const C = capi.status === 'fulfilled' ? capi.value : null;
    if (!T && !E && !C) {
      failed = true;
    } else {
      failed = false;
      const global = Object.assign({}, C ? C.values : {}, E ? E.values : {});
      const b = build(T ? T.values : {}, global);
      const prev = rates || { usd: {}, toman: {} };
      rates = {
        usd: Object.assign({}, prev.usd, b.usd),
        toman: Object.assign({}, prev.toman, b.toman),
        iranUpdated: T ? T.updated : prev.iranUpdated || null,
        globalUpdated: (E && E.updated) || (C && C.updated) || prev.globalUpdated || null,
        fetchedAt: Date.now(),
        iranLive: !!T
      };
      // Without the Tehran feed, keep the last toman prices rather than mixing in derived ones.
      if (!T && prev.toman.USD) rates.toman = Object.assign({}, b.toman, prev.toman);
      persist(RATES_KEY, rates);
    }
    busy = false;
    render();
  }
  statusEl.addEventListener('click', refresh);

  const REFRESH_EVERY = 2 * MIN;
  let poll = 0;
  function schedule() {
    clearInterval(poll);
    poll = setInterval(() => { if (document.visibilityState === 'visible') refresh(); else renderStatus(); }, REFRESH_EVERY);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!rates || Date.now() - rates.fetchedAt > MIN) refresh(); else renderStatus();
    schedule();
  });
  setInterval(renderStatus, 30000);

  // ---- edit + add ----
  editBtn.addEventListener('click', () => { editing = !editing; render(); });

  let shown = [];
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  function renderResults() {
    const n = norm(q.value);
    shown = CATALOG.filter(a => !n || [a.code, a.name, a.fa].some(x => norm(x).includes(n)));
    if (!shown.length) { results.innerHTML = `<p class="empty">Nothing matches “${esc(q.value)}”.</p>`; return; }
    let html = '', last = '';
    shown.forEach((a, i) => {
      if (a.kind !== last) { html += `<div class="group">${KIND_TITLE[a.kind]}</div>`; last = a.kind; }
      const added = state.selected.includes(a.code);
      const p = rates && a.code !== 'IRT' && rates.toman[a.code] ? fmt(rates.toman[a.code], BY_CODE.IRT) + ' T' : '';
      html += `<button class="result" type="button" data-i="${i}"${added ? ' disabled' : ''}>
        ${badge(a)}
        <span class="r-who"><span class="r-name">${esc(a.name)}</span><span class="r-sub">${a.code} · <span class="fa" dir="rtl">${esc(a.fa)}</span>${added ? ' · added' : ''}</span></span>
        <span class="r-price">${p}</span></button>`;
    });
    results.innerHTML = html;
  }
  results.addEventListener('click', e => {
    const b = e.target.closest('.result');
    if (!b || b.disabled) return;
    const a = shown[+b.dataset.i];
    if (!a || state.selected.includes(a.code)) return;
    state.selected.push(a.code);
    save(); buildList(); renderResults();
  });
  function openSheet() { sheet.hidden = false; q.value = ''; renderResults(); results.scrollTop = 0; }
  function closeSheet() { sheet.hidden = true; q.blur(); }
  addBtn.addEventListener('click', openSheet);
  cancelAdd.addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  q.addEventListener('input', renderResults);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  window.addEventListener('resize', render);

  // ---- go ----
  buildList();
  refresh();
  schedule();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
  }
})();
</script>
</body>
</html>
